# CI/CD-STANDARD-conformant pipeline: least-privilege GITHUB_TOKEN, SHA-pinned
# actions, and the merge-blocking gates from SECURITY-AND-SUPPLY-CHAIN-STANDARD
# §§4-5 (SAST, secret scan, SCA) plus CODE-QUALITY-STANDARD §2 (`make verify`).
#
# Every action is pinned to the full 40-char commit SHA of its tag, resolved
# 2026-08-07 via `gh api repos/OWNER/REPO/commits/TAG`. Actions stay
# `@<sha> # vX.Y.Z` so the version is human-readable next to the pin, per
# SECURITY-AND-SUPPLY-CHAIN-STANDARD §6.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Key pull requests on the ref and pushes on the commit.
  #
  # A concurrency group holds one running run and one pending run. A third run
  # joining the group cancels the pending one before it dispatches a single job,
  # so that commit ends `cancelled` with zero jobs and no verdict at all; with
  # `cancel-in-progress: true` the running run is cancelled part-way through
  # instead — also no verdict. A group keyed only on `github.ref` therefore makes
  # every push to `main` contend with the merge before it, and a burst of merges
  # loses the middle ones.
  #
  # Measured 2026-09-05 over the 67 most recent `ci` runs on `main`: 20 ended
  # `cancelled` (6 of them with zero jobs dispatched), and 23 of those 67 commits
  # have no successful `ci` run at all. `pages.yml` publishes only on a
  # *successful* `ci` run for the commit, so each cancelled run is also a commit
  # that never reached families — the site stayed on older content until the next
  # merge's run happened to survive.
  #
  # Keying pushes on the SHA gives every merge its own group, so pushes never
  # contend. Pull requests keep the shared `-pr` key, so pushing again to a PR
  # still cancels the previous, now-irrelevant run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: ">=0.11.0"
          python-version: "3.12"

      # `make verify` ends in `make pages`, which runs html-validate and axe-core
      # over the school pages built from committed fixtures, in both languages.
      # Nothing is served here and nothing is deployed from this job: both
      # checkers read files off disk. Publication is a separate, deliberate
      # decision; it was made on 2026-08-22, and pages.yml carries it out after
      # this workflow succeeds on main.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      # `make verify` is the whole gate: it ends in determinism, secret-scan and
      # sast, which the two jobs below also run individually so a failure names
      # itself. Every step in this file runs a make target, and
      # tests/test_ci_parity.py fails if one ever does not: a stage that exists
      # only here is a stage `make verify` cannot reproduce.
      - name: make verify-ci
        run: make verify-ci

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  secret-scan:
    runs-on: ubuntu-latest
    # 15 is unchanged, and now it is a checked number rather than an assumed
    # one. This job used to read one commit and finish in under a second, so
    # nothing here had been measured against a real scan. It has been:
    # `site/` holds 21,069 published pages, so the patch volume is large even
    # though `main` is only 138 commits, and the first full-history run on this
    # runner read 873 MB across 129 commits in 31.2s (the whole job, 41s). The
    # same walk takes 3m26s locally on 10 cores. 15 minutes is ~29x the measured
    # cost; revisit it if the history grows by an order of magnitude, because a
    # timeout under a job's runtime reads as `cancelled` rather than `failed`
    # and is easy to mistake for a flake.
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # The runner image carries no gitleaks, which is why this job ran an
      # action instead of the target `make verify` has always run. The
      # `gitleaks-binary` prerequisite fetches the pinned release to this path
      # and checks it against the SHA-256 file published with it; on a developer
      # machine `GITLEAKS` stays `gitleaks` and nothing is downloaded.
      GITLEAKS: build/gitleaks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Necessary for a history scan and NOT sufficient for one. This
          # decides how much history actions/checkout puts on disk; how much of
          # it gets read is decided by how the scanner is invoked. This line was
          # already here, unchanged, through every run that read one commit.
          fetch-depth: 0
          persist-credentials: false
      # `gitleaks/gitleaks-action@v3.0.0` ran here until 2026-09-13. It picks
      # its scan range from the triggering event: a push of N commits becomes
      # `--log-opts=--no-merges --first-parent BASE^..HEAD`, a push of ONE
      # commit becomes `--log-opts=-1`, and a pull request becomes the pull
      # request's own commits. Only `schedule` and `workflow_dispatch` drop
      # `--log-opts` and walk the whole history, and this workflow has neither
      # trigger. Every squash merge into `main` is a one-commit push, so the
      # check read 1 of `main`'s 138 commits and reported success. A credential
      # added in one commit and deleted in the next was invisible to it.
      #
      # `make secret-scan-history` runs `gitleaks git .` with no `--log-opts`.
      # With no range, gitleaks walks `git log -p --full-history --all`: every
      # commit on every ref the checkout has, on every event. It is the same
      # history pass `make secret-scan` has always run locally, so the two gates
      # are now the same command rather than two different ones.
      - run: make secret-scan-history

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: make sast
      - run: make workflow-audit

