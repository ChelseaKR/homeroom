# CI/CD-STANDARD-conformant pipeline: least-privilege GITHUB_TOKEN, SHA-pinned
# actions, and the merge-blocking gates from SECURITY-AND-SUPPLY-CHAIN-STANDARD
# §§4-5 (SAST, secret scan, SCA) plus CODE-QUALITY-STANDARD §2 (`make verify`).
#
# Every action is pinned to the full 40-char commit SHA of its tag, resolved
# 2026-08-07 via `gh api repos/OWNER/REPO/commits/TAG`. Actions stay
# `@<sha> # vX.Y.Z` so the version is human-readable next to the pin, per
# SECURITY-AND-SUPPLY-CHAIN-STANDARD §6.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ">=0.11.0"
          python-version: "3.12"

      # `make verify` ends in `make pages`, which runs html-validate and axe-core
      # over the school pages built from committed fixtures, in both languages.
      # Nothing is served here and nothing is deployed from this job: both
      # checkers read files off disk. Publication is a separate, deliberate
      # decision; it was made on 2026-08-22, and pages.yml carries it out after
      # this workflow succeeds on main.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      # `make verify` is the whole gate: it ends in determinism, secret-scan and
      # sast, which the two jobs below also run individually so a failure names
      # itself. Every step in this file runs a make target, and
      # tests/test_ci_parity.py fails if one ever does not: a stage that exists
      # only here is a stage `make verify` cannot reproduce.
      - name: make verify-ci
        run: make verify-ci

      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The action scans history only. `make secret-scan` runs that pass and a
      # second one over the working tree, which is where an uncommitted key
      # sits; see the target's comment for the demonstration.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: make sast
      - run: make workflow-audit

