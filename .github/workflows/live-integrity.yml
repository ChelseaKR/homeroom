# Does the page a parent receives say what this repository says?
#
# These pages carry absenteeism and enrollment numbers about a named public school,
# so a stale one is a wrong number in front of a parent rather than a cosmetic
# defect. `make pages` grades the markup, `make determinism` grades the build, and
# pages.yml refuses to publish without site/index.html and site/CNAME. All of that
# grades the checkout. Nothing here has ever graded the bytes a reader receives, so
# a pages run that failed, never fired, or published an older commit would leave
# every gate green while https://homeroom.chelseakr.com served something else, and
# nothing in this repository could tell.
#
# This is the check for the deployment: read the committed site/ tree that pages.yml
# uploads, fetch each file, and fail naming every byte-level difference. There is no
# rebuild step because `make site` reads the acquired CDE extracts under data/raw/,
# which are not committed; the committed tree is the published artifact itself, and
# `make pages` and `make determinism` are what hold it to the code.
#
# It reads the network, deliberately, which is the one thing the merge gate must
# never do. That is why it lives in its own workflow, holds only `contents: read`,
# and is not a required check: it grades the deployment, and a deployment that has
# not happened yet is not a reason to block a merge.
#
# Runs daily and on demand (Actions > live integrity sentinel > Run workflow).
name: live integrity sentinel

on:
  schedule:
    - cron: "7 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deduplicate reads without ever cancelling or queueing behind a deploy.
  group: live-integrity
  cancel-in-progress: false

jobs:
  verify-live:
    name: the live surface is what this repository publishes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compare the live surface with what this checkout publishes
        # No `shell:` on purpose, so GitHub runs this with `bash -e {0}`. The body
        # below is written for errexit and tests/test_live_sentinel.py runs it under
        # that exact shell; adding a `shell:` here would change what ships out from
        # under the harness, which is why the harness also asserts this key is absent.
        run: |
          set -uo pipefail
          expected_sha="$(git rev-parse HEAD)"

          # `if <command>` is exempt from errexit BY LANGUAGE RULE, which is what makes
          # this the only portable way to read an exit code here. Written as a bare
          # `python3 …` followed by `verify_rc="$?"` until 2026-09-08, the step ended at
          # the python line the instant it failed: `verify_rc` was never assigned and
          # the whole deploy-race block below was unreachable in exactly the case it
          # exists for. Measured on the shipped shell — verify=1 with the remote read
          # also failing exited 1 with no warning annotation, and verify=0 with a
          # failing remote read exited 128, reddening an already-green run with git's
          # own code.
          if python3 tools/verify_live_site.py; then
            verify_rc=0
          else
            verify_rc=$?
          fi

          if [ "$verify_rc" -eq 0 ]; then
            exit 0
          fi

          # Only now is there anything to excuse. A deploy for a newer commit may have
          # landed while this ran, in which case the live surface differing from THIS
          # commit is the deploy working. Taking this read unconditionally is what let
          # a network blip fail a run that had nothing wrong with it.
          if remote_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"; then
            if [ "$remote_sha" != "$expected_sha" ]; then
              echo "::warning::main moved to ${remote_sha} while this ran; re-run once its deploy finishes"
              exit 0
            fi
          else
            echo "::warning::could not re-read origin/main, so a concurrent deploy could not be ruled out; reporting the difference"
          fi
          exit "$verify_rc"
