[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homeroom"
version = "0.1.0"
description = "California public school data, readable by the families it describes"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
  { name = "Chelsea Kelly-Reif" },
]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
# The ask layer (ADR 0003). The core package stays stdlib-only; homeroom.ask
# imports the SDK lazily and only when a provider is configured.
ask = ["anthropic>=1.0,<2"]
# Amazon Bedrock through the same SDK (adds boto3). Install for live
# evaluation runs against Bedrock; not needed for `make verify`.
ask-bedrock = ["anthropic[bedrock]>=1.0,<2"]

[dependency-groups]
dev = [
  "ruff>=0.15.0",
  "mypy>=1.18",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.6",
  "pip-audit>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/homeroom"]

# --- CODE-QUALITY-STANDARD §2 single-source ruff/mypy/pytest config ---
# Portfolio default: repos change values, not keys. Do not fork this block;
# edit STANDARDS/CODE-QUALITY-STANDARD.md upstream if the floor itself moves.

[tool.ruff]
# automation/ is vendored from portfolio-standards standards-init and tracked there;
# it is excluded here rather than diverging from the template.
extend-exclude = ["automation"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "S", "C90", "RUF"]
ignore = ["E501"]            # line length owned by the formatter
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]        # assert is expected in tests
[tool.ruff.lint.mccabe]
max-complexity = 10
[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
warn_return_any = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
  "slow: > 2s",
  "integration: requires an external service",
  "smoke: critical path",
]

[tool.coverage.run]
branch = true
source = ["src"]
[tool.coverage.report]
# CODE-QUALITY-STANDARD §2 sets the apps/services/CLIs minimum at >=85%. That is a
# minimum, not this repo's floor. The suite measures 98.85% branch coverage over 791
# tests (2026-09-06), so 85 was never a floor under this suite: it was 13.7 points of
# room in which a regression could land and still leave the build green. The gate now
# sits a few points under what is actually measured, which is the slack
# fare-policy-assistant states in its Makefile: enough to absorb Python-version and
# optional-extra drift in CI, not enough to hide a real loss of covered code.
fail_under = 95
show_missing = true
