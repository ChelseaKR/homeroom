# Required floor per SECURITY-AND-SUPPLY-CHAIN-STANDARD §5: gitleaks + ruff
# (+ mypy/pyright as pre-push) in every repo.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: uv run mypy --strict src
        language: system
        pass_filenames: false
        stages: [pre-push]
