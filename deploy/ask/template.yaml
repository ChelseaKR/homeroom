# Deployment shape for the ask service (ADR 0003). APPLIED 2026-08-22 as stack
# `homeroom-ask` in us-west-2, by the owner's decision. README.md in this
# directory records the parameters as applied, the rollback, and what is still
# open. Nothing in this repository applies it; a person does, with the commands
# below.
#
# One Lambda function behind a Function URL, CORS and a server-side origin check
# locked to the site's origin, cost bounded three ways: reserved concurrency (at
# most N requests in flight), the service's own per-client rate limit and daily
# cap (env below), and a CloudWatch alarm on daily invocations to an SNS topic
# created here.
#
# Deploying (by a person):
#
# Pass parameters from a file, not the Key=Value shorthand: BedrockModelArns is
# a list, and escaping its commas as \, puts the backslashes into the ARNs. The
# stack still deploys green and every question then returns "unavailable".
#   aws cloudformation deploy ... --parameter-overrides file://params.json
#
# The two phases, in order:
#   aws cloudformation deploy --template-file deploy/ask/template.yaml \
#     --stack-name homeroom-ask --capabilities CAPABILITY_IAM \
#     --parameter-overrides DeployFunction=false SiteOrigin=https://<site> \
#       Provider=bedrock Model=<model> BedrockModelArns=<arns>
#   ./deploy/ask/build.sh                       -> dist/ask-lambda.zip (code + bundle + SDK)
#   aws s3 cp dist/ask-lambda.zip s3://<stack code bucket>/ask/<sha>.zip
#   aws cloudformation deploy ... DeployFunction=true CodeKey=ask/<sha>.zip ...
AWSTemplateFormatVersion: "2010-09-09"
Description: Homeroom ask service (ADR 0003). Unofficial; not affiliated with CDE.

Parameters:
  DeployFunction:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      Two-phase deploy, so everything stays inside this one stack: phase one
      ("false") creates only the private code bucket; a person uploads
      build.sh's zip to it; phase two ("true") creates the function and URL.
  CodeKey:
    Type: String
    Default: ""
    Description: S3 key of the built zip inside the stack's own code bucket.
  SiteOrigin:
    Type: String
    Description: The only origin allowed to call (scheme + host, no path).
    AllowedPattern: "^https://[A-Za-z0-9.-]+$"
  Provider:
    Type: String
    AllowedValues: [bedrock, anthropic]
    Default: bedrock
    Description: bedrock uses the function's IAM role (no key); anthropic needs ApiKey.
  Model:
    Type: String
    Default: claude-sonnet-5
    Description: Model id. For bedrock, the inference profile id the account can invoke.
  BedrockModelArns:
    Type: CommaDelimitedList
    Description: >-
      Exactly the ARNs the function may invoke: the inference-profile ARN and
      the foundation-model ARN(s) it routes to. No default on purpose; a
      wildcard here would be a wider grant than the one model the service runs.
  ApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Anthropic API key, only when Provider=anthropic. Never committed anywhere.
  DailyCap:
    Type: Number
    Default: 400
    Description: Model calls per UTC day, per warm container (two per answered question).
  PerMinute:
    Type: Number
    Default: 6
    Description: Requests per client per minute.
  ReservedConcurrency:
    Type: Number
    Default: 2
    Description: Hard ceiling on concurrent executions, which is the real cost bound.
  DailyInvocationAlarm:
    Type: Number
    Default: 400
    Description: Alarm when invocations in 24h exceed this (the daily cap).

Conditions:
  UsesAnthropic: !Equals [!Ref Provider, anthropic]
  FunctionPhase: !Equals [!Ref DeployFunction, "true"]

Resources:
  CodeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-code-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alarms"
      # No subscription is created here: an alert address is the owner's to
      # give. Until one is subscribed, the alarm still records its state in
      # CloudWatch; subscribing later needs no stack change.
  Role:
    Type: AWS::IAM::Role
    Condition: FunctionPhase
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: bedrock-invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource: !Ref BedrockModelArns

  LogGroup:
    Type: AWS::Logs::LogGroup
    Condition: FunctionPhase
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}"
      RetentionInDays: 14

  Function:
    Type: AWS::Lambda::Function
    Condition: FunctionPhase
    DependsOn: LogGroup
    Properties:
      FunctionName: !Ref AWS::StackName
      Runtime: python3.12
      Architectures: [arm64]
      Handler: homeroom.ask.http.lambda_handler
      Role: !GetAtt Role.Arn
      MemorySize: 512
      Timeout: 40
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          HOMEROOM_ASK_BUNDLE: /var/task/bundle
          # Both data roots are named explicitly. The corpus default is derived
          # from the source tree's shape, which the deployment package does not
          # have; naming it here is what makes the package layout build.sh
          # chooses the layout that runs.
          HOMEROOM_ASK_CORPUS: /var/task/corpus
          HOMEROOM_ASK_PROVIDER: !Ref Provider
          HOMEROOM_ASK_MODEL: !Ref Model
          HOMEROOM_ASK_ORIGIN: !Ref SiteOrigin
          HOMEROOM_ASK_DAILY_CAP: !Ref DailyCap
          HOMEROOM_ASK_PER_MINUTE: !Ref PerMinute
          ANTHROPIC_API_KEY: !If [UsesAnthropic, !Ref ApiKey, !Ref AWS::NoValue]

  Url:
    Type: AWS::Lambda::Url
    Condition: FunctionPhase
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: NONE
      InvokeMode: BUFFERED
      # No Cors block here on purpose, and it must stay that way.
      #
      # The handler already emits the full CORS set and is the same code that
      # enforces the origin server-side (`origin_allowed`), which is the check
      # that actually protects anything -- a Function URL Cors config only adds
      # response headers and answers preflight; it refuses nobody.
      #
      # With both configured, Lambda adds its Access-Control-Allow-Origin and
      # the handler adds its own, and the browser receives
      #   access-control-allow-origin: https://homeroom.chelseakr.com, https://homeroom.chelseakr.com
      # which every browser rejects ("contains multiple values, but only one is
      # allowed"). The ask page then falls back to its fixed "service is not
      # available" string, which is correct behaviour and completely hides the
      # cause. curl cannot see this: it prints the header and does not enforce
      # it. This was found on 2026-08-22 by loading the live page in a real
      # browser, after curl had reported the same endpoint healthy and
      # answering. Verify CORS by rendering, not by reading.
      #
      # Removing the block also means OPTIONS reaches the function, which
      # handles preflight itself (see `lambda_handler`).

  UrlPermission:
    Type: AWS::Lambda::Permission
    Condition: FunctionPhase
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # A second grant, and it is not redundant. With only the InvokeFunctionUrl
  # grant above, every request to the Function URL returned 403 Forbidden while
  # the CORS preflight (which the URL service answers before the request reaches
  # the function) returned 200 -- so the URL was configured correctly and the
  # invoke itself was what was denied. This account also requires
  # `lambda:InvokeFunction` before an unauthenticated caller can run the
  # function. Measured on 2026-08-22 against a live deploy, not assumed.
  #
  # It is not narrowed by `FunctionUrlAuthType`, because Lambda rejects that
  # property on any action but InvokeFunctionUrl ("FunctionUrlAuthType is only
  # supported for lambda:InvokeFunctionUrl action"), and CloudFormation cannot
  # express the `lambda:InvokedViaFunctionUrl` condition that would narrow it
  # instead. What that costs is bounded: this function's URL is already public
  # and unauthenticated by design (ADR 0003), so the only thing this grant adds
  # is that a caller who already holds AWS credentials may reach the same
  # handler through the Invoke API instead of through the URL. It is the same
  # code, the same one-school-per-request shape, the same verifier, and the same
  # reserved concurrency and daily cap bounding the spend. Nothing reachable
  # this way is unreachable with curl.
  UrlInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: FunctionPhase
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: "*"

  InvocationAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: FunctionPhase
    Properties:
      AlarmDescription: Ask service invocations in a day exceeded the envelope.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref Function
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: !Ref DailyInvocationAlarm
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  CodeBucketName:
    Value: !Ref CodeBucket
    Description: Upload build.sh's zip here, then redeploy with DeployFunction=true.
  AlarmTopicArn:
    Value: !Ref AlarmTopic
    Description: Subscribe an owner address to receive the daily-invocation alarm.
  FunctionUrl:
    Condition: FunctionPhase
    Value: !GetAtt Url.FunctionUrl
    Description: Pass this to the site build as --ask-endpoint.
